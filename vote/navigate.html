<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>个人中心 - 新闻部</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <!-- 引入 Remix Icon 图标库 -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <!-- 引入 Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #004d99;
            --primary-light: #0066cc;
            --secondary: #3498db;
            --accent: #e74c3c;
            --light-bg: #f0f8ff;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --text-light: #666;
            --success: #2ecc71;
            --shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', '微软雅黑', sans-serif;
        }
        
        html {
            height: 100%;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch; 
        }
        
        body {
            background: linear-gradient(135deg, #e6f2ff, #f0f8ff);
            color: var(--text);
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            padding-bottom: 120px; /* 为底部导航栏留空间 */
        }
        
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 10% 20%, rgba(0, 77, 153, 0.05) 0%, transparent 15%),
                radial-gradient(circle at 90% 80%, rgba(52, 152, 219, 0.05) 0%, transparent 15%);
            z-index: -1;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 25px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            border-radius: 15px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
            animation: headerFloat 6s ease-in-out infinite;
        }
        
        @keyframes headerFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        
        header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        header p {
            font-size: 1rem;
            opacity: 0.9;
        }
        
        .profile-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 30px;
            box-shadow: var(--shadow);
            margin-bottom: 25px;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        
        .profile-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            border-color: var(--secondary);
        }
        
        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--light-bg);
        }
        
        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 36px;
            box-shadow: 0 4px 15px rgba(0, 77, 153, 0.3);
        }
        
        .profile-info h2 {
            color: var(--primary);
            margin-bottom: 8px;
            font-size: 1.5rem;
        }
        
        .profile-info p {
            color: var(--text-light);
            font-size: 0.95rem;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .stat-item {
            background: linear-gradient(135deg, var(--light-bg), #e6f2ff);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .stat-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 77, 153, 0.15);
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 0.85rem;
            color: var(--text-light);
        }
        
        .menu-section {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: var(--shadow);
            margin-bottom: 25px;
        }
        
        .menu-title {
            padding: 20px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
        }
        
        .menu-item {
            display: flex;
            align-items: center;
            padding: 18px 20px;
            border-bottom: 1px solid var(--light-bg);
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: var(--text);
        }
        
        .menu-item:last-child {
            border-bottom: none;
        }
        
        .menu-item:hover {
            background: var(--light-bg);
            transform: translateX(5px);
        }
        
        .menu-item i {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border-radius: 10px;
            margin-right: 15px;
            font-size: 18px;
        }
        
        .menu-item-content {
            flex: 1;
        }
        
        .menu-item-title {
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .menu-item-desc {
            font-size: 0.85rem;
            color: var(--text-light);
        }
        
        .menu-item-arrow {
            color: var(--text-light);
            font-size: 18px;
        }
        
        /* 实时排行榜样式 */
        .rank-section {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: var(--shadow);
            margin-bottom: 25px;
        }
        
        .rank-header {
            padding: 20px;
            background: linear-gradient(135deg, #f39c12, #e74c3c);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .rank-update-time {
            font-size: 0.75rem;
            font-weight: normal;
            opacity: 0.8;
        }
        
        .rank-list {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .rank-loading {
            text-align: center;
            padding: 30px;
            color: var(--text-light);
        }
        
        .rank-empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
        }
        
        .rank-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid var(--light-bg);
            transition: background 0.2s;
        }
        
        .rank-item:hover {
            background: var(--light-bg);
        }
        
        .rank-item:last-child {
            border-bottom: none;
        }
        
        .rank-badge {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            margin-right: 15px;
            flex-shrink: 0;
        }
        
        .rank-badge.gold {
            background: linear-gradient(135deg, #f1c40f, #f39c12);
            color: white;
        }
        
        .rank-badge.silver {
            background: linear-gradient(135deg, #bdc3c7, #95a5a6);
            color: white;
        }
        
        .rank-badge.bronze {
            background: linear-gradient(135deg, #e67e22, #d35400);
            color: white;
        }
        
        .rank-badge.default {
            background: var(--light-bg);
            color: var(--text-light);
        }
        
        .rank-info {
            flex: 1;
            min-width: 0;
        }
        
        .rank-title {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }
        
        .rank-votes {
            font-size: 0.8rem;
            color: var(--text-light);
        }
        
        .rank-votes span {
            color: var(--accent);
            font-weight: bold;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-light);
            margin-top: 30px;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }
            
            header {
                padding: 20px 15px;
            }
            
            header h1 {
                font-size: 1.6rem;
            }
            
            .profile-header {
                flex-direction: column;
                text-align: center;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 480px) {
            header h1 {
                font-size: 1.4rem;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        /* === 底部玻璃拟态导航栏 === */
        .glass-navbar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center; /* 居中对齐 */
            gap: 8px;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 50px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            padding: 10px 20px;
            min-width: 400px;
            max-width: 600px;
            z-index: 999;
            transition: all 0.3s ease;
            width: fit-content; /* 根据内容自适应宽度 */
        }

        .navbar-slider {
            position: absolute;
            bottom: 8px;
            height: 4px;
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            border-radius: 2px;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 10px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
            color: var(--text-light);
            text-decoration: none;
            flex: 0 0 auto; /* 不伸缩，根据内容自适应 */
            max-width: 120px;
        }

        .nav-item i {
            font-size: 20px;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .nav-item span {
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .nav-item:hover {
            color: var(--primary-light);
        }

        .nav-item:hover i {
            transform: scale(1.1) translateY(-2px);
        }

        .nav-item.active {
            color: #1976d2;
        }

        .nav-item.active i {
            transform: scale(1.15) translateY(-3px);
        }

        .nav-item:active i {
            transform: scale(0.95);
        }

        @media (max-width: 768px) {
            .glass-navbar {
                min-width: calc(100% - 40px);
                max-width: calc(100% - 40px);
                left: 50%; /* 保持居中定位 */
                transform: translateX(-50%); /* 确保水平居中 */
                padding: 10px 15px;
                bottom: 20px;
                gap: 5px;
                width: calc(100% - 40px); /* 固定宽度计算 */
            }

            .nav-item {
                padding: 8px 12px;
                max-width: 100px;
                flex: 0 0 auto; /* 不伸缩 */
            }

            .nav-item i {
                font-size: 18px;
            }

            .nav-item span {
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .glass-navbar {
                min-width: calc(100% - 30px);
                max-width: calc(100% - 30px);
                left: 50%; /* 保持居中定位 */
                transform: translateX(-50%); /* 确保水平居中 */
                padding: 8px 12px;
                bottom: 15px;
                gap: 3px;
                width: calc(100% - 30px); /* 固定宽度计算 */
            }

            .nav-item {
                padding: 6px 8px;
                max-width: 90px;
                flex: 0 0 auto; /* 不伸缩 */
            }

            .nav-item i {
                font-size: 16px;
            }

            .nav-item span {
                font-size: 11px;
            }
        }

        /* === 更新日志弹窗样式 === */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        .popup-overlay.active {
            display: flex;
            opacity: 1;
        }
        
        .popup-content {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            transform: scale(0.8);
            transition: transform 0.5s ease;
            animation: popupSlideIn 0.5s ease forwards;
        }
        
        .popup-overlay.active .popup-content {
            transform: scale(1);
        }
        
        @keyframes popupSlideIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        
        .close-icon {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 2rem;
            cursor: pointer;
            color: var(--text-light);
            transition: color 0.3s ease;
        }
        
        .close-icon:hover {
            color: var(--accent);
        }
        
        .popup-title {
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 1.8rem;
            text-align: center;
        }
        
        .close-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            display: block;
            margin: 25px auto 0;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 77, 153, 0.3);
            width: 100%;
            max-width: 200px;
        }
        
        .close-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 77, 153, 0.4);
        }
        
        /* === 全局音乐播放器底部播放条样式 === */
        .music-player-bar {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 860px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 998;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        
        .music-player-bar.active {
            opacity: 1;
            visibility: visible;
            bottom: 100px;
        }
        
        .player-album-cover {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .player-album-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .player-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .player-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .player-artist {
            font-size: 12px;
            color: var(--text-light);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .player-controls {
            flex-shrink: 0;
        }
        
        .player-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 77, 153, 0.3);
        }
        
        .player-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 12px rgba(0, 77, 153, 0.4);
        }
        
        .player-btn:active {
            transform: scale(0.95);
        }
        
        @media (max-width: 768px) {
            .music-player-bar {
                width: calc(100% - 30px);
                bottom: 90px;
            }
        }
        
        /* === 全屏歌词播放器样式 === */
        .full-screen-player {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            visibility: hidden;
        }
        
        .full-screen-player.active {
            transform: translateY(0);
            opacity: 1;
            visibility: visible;
        }
        
        .fsp-header {
            display: flex;
            align-items: center;
            padding: 20px;
            color: white;
            position: relative;
        }
        
        .fsp-back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 10px;
            transition: transform 0.3s ease;
        }
        
        .fsp-back-btn:hover {
            transform: scale(1.1);
        }
        
        .fsp-song-info {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            flex: 1;
        }
        
        .fsp-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 300px;
        }
        
        .fsp-artist {
            font-size: 14px;
            opacity: 0.8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 300px;
        }
        
        .fsp-spacer {
            width: 50px;
        }
        
        .fsp-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }
        
        .fsp-album-art {
            width: 250px;
            height: 250px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }
        
        .fsp-album-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .fsp-album-art.playing {
            animation: albumRotate 20s linear infinite;
        }
        
        @keyframes albumRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .fsp-lyrics-container {
            width: 100%;
            max-width: 600px;
            height: 200px;
            overflow: hidden;
            position: relative;
            mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 80%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 80%, transparent 100%);
        }
        
        .fsp-lyrics-scroll {
            height: 100%;
            overflow-y: auto;
            scroll-behavior: smooth;
            padding: 80px 0;
            scrollbar-width: none;
        }
        
        .fsp-lyrics-scroll::-webkit-scrollbar {
            display: none;
        }
        
        .fsp-lyric-line {
            padding: 12px 20px;
            text-align: center;
            font-size: 18px;
            color: rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
            line-height: 1.6;
        }
        
        .fsp-lyric-line.active {
            font-size: 28px;
            color: #ffffff;
            font-weight: 700;
            transform: scale(1.05);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }
        
        .fsp-controls {
            padding: 20px 30px 40px;
            background: rgba(0, 0, 0, 0.3);
        }
        
        .fsp-progress-bar {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .fsp-current-time,
        .fsp-duration {
            color: white;
            font-size: 14px;
            min-width: 45px;
            text-align: center;
        }
        
        .fsp-progress-slider {
            flex: 1;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }
        
        .fsp-progress-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            background: white;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        
        .fsp-progress-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        
        .fsp-progress-slider::-moz-range-thumb {
            width: 14px;
            height: 14px;
            background: white;

    <script>
        let userUniqueId = null;
        let userVotes = {
            votedSongs: [],
            remainingVotes: 5,
            totalVotes: 0,
            maxVotes: 5
        };

        // 生成用户唯一标识
        function generateUserFingerprint() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            ctx.textBaseline = 'top';
            ctx.font = '14px Arial';
            ctx.fillText('Browser fingerprint', 2, 2);
            const canvasFingerprint = canvas.toDataURL();
            
            const fingerprint = {
                userAgent: navigator.userAgent,
                language: navigator.language,
                platform: navigator.platform,
                screen: `${screen.width}x${screen.height}x${screen.colorDepth}`,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                canvas: canvasFingerprint.slice(-50),
                timestamp: Date.now()
            };
            
            const fingerprintString = JSON.stringify(fingerprint);
            let hash = 0;
            for (let i = 0; i < fingerprintString.length; i++) {
                const char = fingerprintString.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            
            return Math.abs(hash).toString(36) + Date.now().toString(36);
        }
        
        // 初始化用户标识
        function initUserIdentifier() {
            let storedId = localStorage.getItem('userUniqueId');
            let storedTimestamp = localStorage.getItem('userIdTimestamp');
            
            const expirationTime = 7 * 24 * 60 * 60 * 1000;
            const now = Date.now();
            
            if (storedId && storedTimestamp && (now - parseInt(storedTimestamp)) < expirationTime) {
                userUniqueId = storedId;
            } else {
                userUniqueId = generateUserFingerprint();
                localStorage.setItem('userUniqueId', userUniqueId);
                localStorage.setItem('userIdTimestamp', now.toString());
            }
            
            document.getElementById('userId').textContent = userUniqueId.substring(0, 12) + '...';
        }

        // 加载用户投票状态
        async function loadUserVoteStatus() {
            try {
                const response = await fetch(`vote_new.php?action=getvotes&userUniqueId=${encodeURIComponent(userUniqueId)}`);
                if (response && response.ok) {
                    const data = await response.json();
                    if (data.success) {
                        userVotes = data;
                        updateStatsDisplay();
                    }
                }
            } catch (error) {
                console.error('状态获取失败', error);
            }
        }

        // 更新统计显示
        function updateStatsDisplay() {
            document.getElementById('voteCount').textContent = userVotes.totalVotes;
            document.getElementById('remainingVotes').textContent = userVotes.maxVotes - userVotes.totalVotes;
        }
                
        // 加载实时排行榜
        async function loadLeaderboard() {
            try {
                const response = await fetch('get_vote_records.php');
                if (response && response.ok) {
                    const data = await response.json();
                    const rankList = document.getElementById('rankList');
                    const rankUpdateTime = document.getElementById('rankUpdateTime');
                            
                    if (data.success && data.records && data.records.length > 0) {
                        // 统计每首歌的票数
                        const voteCounts = {};
                        data.records.forEach(r => {
                            voteCounts[r.songId] = (voteCounts[r.songId] || 0) + 1;
                        });
                                
                        // 排序并取前10
                        const ranking = Object.entries(voteCounts)
                            .map(([songId, count]) => {
                                const record = data.records.find(r => r.songId == songId);
                                return {
                                    songId: parseInt(songId),
                                    title: record ? record.songName : `歌曲${songId}`,
                                    votes: count
                                };
                            })
                            .sort((a, b) => b.votes - a.votes)
                            .slice(0, 10);
                                
                        const now = new Date();
                        rankUpdateTime.textContent = now.getHours().toString().padStart(2, '0') + ':' + 
                            now.getMinutes().toString().padStart(2, '0');
                                
                        let html = '';
                        ranking.forEach((item, index) => {
                            let badgeClass = 'default';
                            if (index === 0) badgeClass = 'gold';
                            else if (index === 1) badgeClass = 'silver';
                            else if (index === 2) badgeClass = 'bronze';
                                    
                            html += `<div class="rank-item">
                                <div class="rank-badge ${badgeClass}">${index + 1}</div>
                                <div class="rank-info">
                                    <div class="rank-title">${item.title}</div>
                                    <div class="rank-votes">票数: <span>${item.votes}</span></div>
                                </div>
                            </div>`;
                        });
                        rankList.innerHTML = html;
                    } else {
                        rankList.innerHTML = '<div class="rank-empty"><i class="fas fa-chart-bar" style="font-size: 32px; margin-bottom: 10px; opacity: 0.5;"></i><p>暂无投票数据</p></div>';
                    }
                }
            } catch (error) {
                console.error('排行榜加载失败', error);
                const rankList = document.getElementById('rankList');
                rankList.innerHTML = '<div class="rank-empty"><p>加载失败，请刷新重试</p></div>';
            }
        }
                
        // 查看投票记录
        function checkVoteRecords() {
            if (userVotes.totalVotes === 0) {
                alert('您还没有投过票哦~');

        // 加载更新日志
        async function loadChangelog() {
            const container = document.getElementById('changelog-container');
            try {
                const response = await fetch('../submit/changelog_api.php');
                const data = await response.json();
                
                if (data.success && data.data && data.data.length > 0) {
                    const typeColors = {

            }

        // 初始化底部导航栏
        function initGlassNavbar() {
            const navItems = document.querySelectorAll('.nav-item');
            const slider = document.getElementById('navbarSlider');
            
            function moveSlider(item) {
                const itemWidth = item.offsetWidth;
                const itemLeft = item.offsetLeft;
                const sliderWidth = itemWidth - 16;
                
                slider.style.width = sliderWidth + 'px';
                slider.style.left = (itemLeft + 8) + 'px';
            }
            
            const activeItem = document.querySelector('.nav-item.active');
            if (activeItem) {
                setTimeout(() => moveSlider(activeItem), 100);
            }
            
            navItems.forEach(item => {
                item.addEventListener('click', function(e) {
                    setTimeout(() => {
                        navItems.forEach(nav => nav.classList.remove('active'));
                        this.classList.add('active');
                        moveSlider(this);
                    }, 100);
                    
                    const targetPage = this.getAttribute('href');
                    console.log('导航到：' + targetPage);
                });
                
                item.addEventListener('mousedown', function() {
                    const icon = this.querySelector('i');
                    icon.style.transform = 'scale(0.95)';
                });
                
                item.addEventListener('mouseup', function() {
                    const icon = this.querySelector('i');
                    if (this.classList.contains('active')) {
                        icon.style.transform = 'scale(1.15) translateY(-3px)';
                    } else {
                        icon.style.transform = '';
                    }
                });
                
                item.addEventListener('mouseleave', function() {
                    const icon = this.querySelector('i');
                    if (this.classList.contains('active')) {
                        icon.style.transform = 'scale(1.15) translateY(-3px)';
                    } else {
                        icon.style.transform = '';
                    }
                });
            });
            
            window.addEventListener('resize', () => {
                const currentItem = document.querySelector('.nav-item.active');
                if (currentItem) {
                    moveSlider(currentItem);
                }
            });
        }

        // 页面加载完成

            initUserIdentifier();
            loadUserVoteStatus();

            initGlobalMusicPlayerBar();
            initFullScreenPlayer();

        // ==================== 全局音乐播放器初始化 ====================
        function initGlobalMusicPlayerBar() {
            const playerBar = document.getElementById('globalMusicPlayerBar');
            const playBtn = document.getElementById('globalPlayerPlayBtn');
            const coverImg = document.getElementById('globalPlayerCoverImg');
            const titleEl = document.getElementById('globalPlayerTitle');
            const artistEl = document.getElementById('globalPlayerArtist');
            
            if (!playerBar || !playBtn) return;
            
            // 检查是否有待播放的歌曲
            const currentSong = window.GlobalMusicManager ? window.GlobalMusicManager.getCurrentSong() : null;
            if (currentSong && currentSong.url) {
                // 显示播放条
                playerBar.classList.add('active');
                titleEl.textContent = currentSong.name || '未知歌曲';
                artistEl.textContent = currentSong.artist || '未知歌手';
                if (currentSong.coverUrl) {
                    coverImg.src = currentSong.coverUrl;
                }
                
                // 更新播放按钮图标
                updatePlayButtonIcon();
            }
            
            // 监听播放/暂停按钮点击
            playBtn.addEventListener('click', function() {
                if (window.GlobalMusicManager) {
                    window.GlobalMusicManager.toggle();
                }
            });
            
            // 点击播放条打开全屏播放器
            playerBar.addEventListener('click', function(e) {
                // 如果点击的不是播放按钮，则打开全屏播放器
                if (!e.target.closest('.player-btn')) {
                    openFullScreenPlayer();
                }
            });
            
            // 监听全局音乐状态变化
            window.addEventListener('globalMusicPlayStateChange', function(e) {
                updatePlayButtonIcon();
                updateFullScreenPlayerState();
            });
            
            // 监听歌曲加载事件
            window.addEventListener('globalMusicSongLoaded', function(e) {
                const songData = e.detail;
                if (songData) {
                    playerBar.classList.add('active');
                    titleEl.textContent = songData.name || '未知歌曲';
                    artistEl.textContent = songData.artist || '未知歌手';
                    if (songData.coverUrl) {
                        coverImg.src = songData.coverUrl;
                    }
                    
                    // 如果有歌曲ID，获取歌词和封面
                    if (songData.id) {
                        fetchMusicDetail(songData.id);
                        fetchLyricForNavigate(songData.id);
                    }
                }
            });
            
            // 更新播放按钮图标
            function updatePlayButtonIcon() {
                const isPlaying = window.GlobalMusicManager ? window.GlobalMusicManager.isPlaying() : false;
                playBtn.innerHTML = isPlaying ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play"></i>';
            }
        }
        
        // ==================== 全屏播放器功能 ====================

        let scrollTimeout = null;
        let lastScrollTime = 0;
        
        // 打开全屏播放器
        function openFullScreenPlayer() {
            const fsp = document.getElementById('fullScreenPlayer');
            if (fsp) {
                fsp.classList.add('active');
                
                // 更新全屏播放器信息
                const currentSong = window.GlobalMusicManager ? window.GlobalMusicManager.getCurrentSong() : null;
                if (currentSong) {
                    document.getElementById('fspTitle').textContent = currentSong.name || '未知歌曲';
                    document.getElementById('fspArtist').textContent = currentSong.artist || '未知歌手';
                    
                    const albumCover = document.getElementById('fspAlbumCover');
                    if (albumCover && currentSong.coverUrl) {
                        albumCover.src = currentSong.coverUrl;
                    }
                    
                    // 如果有音频正在播放，立即更新歌词
                    const audio = window.GlobalMusicManager ? window.GlobalMusicManager.getAudio() : null;
                    if (audio && currentSongLyrics.length > 0) {
                        updateFullScreenPlayer(currentSongLyrics, audio.currentTime, audio.duration, !audio.paused);
                    }
                }
            }
        }
        
        // 关闭全屏播放器
        function closeFullScreenPlayer() {
            const fsp = document.getElementById('fullScreenPlayer');
            if (fsp) {
                fsp.classList.remove('active');
            }
        }
        
        // 获取歌曲详情（封面）
        function fetchMusicDetail(songId) {
            fetch(`../submit/api.php?action=music_detail&id=${songId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.songs && data.songs[0]) {
                        const song = data.songs[0];
                        
                        // 获取封面
                        if (song.al && song.al.picUrl) {
                            const coverUrl = song.al.picUrl;
                            const albumCover = document.getElementById('fspAlbumCover');
                            if (albumCover) {
                                albumCover.src = coverUrl;
                            }
                            
                            // 更新底部播放条封面
                            const globalCoverImg = document.getElementById('globalPlayerCoverImg');
                            if (globalCoverImg) {
                                globalCoverImg.src = coverUrl;
                            }
                        }
                    }
                })
                .catch(err => {
                    console.error('获取歌曲详情失败:', err);
                });
        }
        
        // 解析LRC歌词
        function parseLrc(lrcText) {
            const lines = lrcText.split('\n');
            const result = [];
            const timeReg = /\[(\d{2}):(\d{2})(?:\.(\d{2,3}))?\]/;
            
            lines.forEach(line => {
                const match = timeReg.exec(line);
                if (match) {
                    const min = parseInt(match[1]);
                    const sec = parseInt(match[2]);
                    const ms = match[3] ? parseFloat("0." + match[3]) : 0;
                    const time = min * 60 + sec + ms;
                    const text = line.replace(timeReg, '').trim();
                    if (text) {
                        result.push({ time, text });
                    }
                }
            });
            
            return result.sort((a, b) => a.time - b.time);
        }
        
        // 获取歌词
        function fetchLyricForNavigate(songId) {
            currentSongLyrics = [];
            
            const lyricUrl = `https://music.163.com/api/song/lyric?os=pc&id=${songId}&lv=-1`;
            
            fetch(`../vote/music_api_handler.php?action=get_lyric&url=${encodeURIComponent(lyricUrl)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.lrc && data.lrc.lyric) {
                        currentSongLyrics = parseLrc(data.lrc.lyric);
                        
                        // 如果全屏播放器已打开，立即更新
                        const audio = window.GlobalMusicManager ? window.GlobalMusicManager.getAudio() : null;
                        if (audio && document.getElementById('fullScreenPlayer').classList.contains('active')) {
                            updateFullScreenPlayer(currentSongLyrics, audio.currentTime, audio.duration, !audio.paused);
                        }
                    }
                })
                .catch(err => {
                    console.error('获取歌词失败:', err);
                    currentSongLyrics = [];
                });
        }
        
        // 更新全屏播放器
        function updateFullScreenPlayer(lyrics, currentTime, duration, isPlaying) {
            const lyricsScroll = document.getElementById('fspLyricsScroll');
            if (!lyricsScroll || !lyrics || lyrics.length === 0) return;
            
            // 生成歌词HTML
            let html = '';
            lyrics.forEach((line, index) => {
                html += `<div class="fsp-lyric-line" data-index="${index}">${line.text}</div>`;
            });
            lyricsScroll.innerHTML = html;
            
            // 找到当前应该高亮的歌词行
            let curIndex = -1;
            for (let i = 0; i < lyrics.length; i++) {
                if (currentTime >= lyrics[i].time) {
                    curIndex = i;
                } else {
                    break;
                }
            }
            
            // 移除所有active类
            const lines = lyricsScroll.querySelectorAll('.fsp-lyric-line');
            lines.forEach(line => line.classList.remove('active'));
            
            // 添加active类到当前行
            if (curIndex >= 0 && lines[curIndex]) {
                lines[curIndex].classList.add('active');
                // 只有在用户没有手动滚动时才自动滚动
                if (!isUserScrolling) {
                    lines[curIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
            
            // 更新时间显示
            document.getElementById('fspCurrentTime').textContent = formatTime(currentTime);
            document.getElementById('fspDuration').textContent = formatTime(duration);
            
            // 更新进度条
            const slider = document.getElementById('fspProgressSlider');
            if (slider && duration > 0) {
                slider.value = (currentTime / duration) * 100;
            }
            
            // 更新专辑封面旋转状态
            const albumArt = document.querySelector('.fsp-album-art');
            if (albumArt) {
                if (isPlaying) {
                    albumArt.classList.add('playing');
                } else {
                    albumArt.classList.remove('playing');
                }
            }
        }
        
        // 更新全屏播放器状态
        function updateFullScreenPlayerState() {
            const audio = window.GlobalMusicManager ? window.GlobalMusicManager.getAudio() : null;
            if (audio && currentSongLyrics.length > 0) {
                updateFullScreenPlayer(currentSongLyrics, audio.currentTime, audio.duration, !audio.paused);
            }
            
            // 更新播放按钮
            const playPauseBtn = document.getElementById('fspPlayPauseBtn');
            if (playPauseBtn) {
                const isPlaying = window.GlobalMusicManager ? window.GlobalMusicManager.isPlaying() : false;
                playPauseBtn.innerHTML = isPlaying ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play"></i>';
            }
        }
        
        // 格式化时间
        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // 初始化全屏播放器事件
        function initFullScreenPlayer() {
            const fspBackBtn = document.getElementById('fspBackBtn');
            const fspPlayPauseBtn = document.getElementById('fspPlayPauseBtn');
            const fspProgressSlider = document.getElementById('fspProgressSlider');
            const fspLyricsScroll = document.getElementById('fspLyricsScroll');
            
            // 返回按钮
            if (fspBackBtn) {
                fspBackBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    closeFullScreenPlayer();
                });
            }
            
            // 播放/暂停按钮
            if (fspPlayPauseBtn) {
                fspPlayPauseBtn.addEventListener('click', function() {
                    if (window.GlobalMusicManager) {
                        window.GlobalMusicManager.toggle();
                    }
                });
            }
            
            // 进度条拖动
            if (fspProgressSlider) {
                fspProgressSlider.addEventListener('input', function() {
                    const audio = window.GlobalMusicManager ? window.GlobalMusicManager.getAudio() : null;
                    if (audio) {
                        const newTime = (this.value / 100) * audio.duration;
                        window.GlobalMusicManager.seek(newTime);
                    }
                });
            }
            
            // 歌词滚动事件
            if (fspLyricsScroll) {
                fspLyricsScroll.addEventListener('scroll', function() {
                    isUserScrolling = true;
                    lastScrollTime = Date.now();
                    
                    if (scrollTimeout) {
                        clearTimeout(scrollTimeout);
                    }
                    
                    scrollTimeout = setTimeout(() => {
                        isUserScrolling = false;
                        // 3秒后自动回位
                        const audio = window.GlobalMusicManager ? window.GlobalMusicManager.getAudio() : null;
                        if (audio && currentSongLyrics && currentSongLyrics.length > 0) {
                            updateFullScreenPlayer(currentSongLyrics, audio.currentTime, audio.duration, !audio.paused);
                        }
                    }, 3000);
                });
            }
            
            // 定时更新歌词（每秒）
            setInterval(() => {
                if (document.getElementById('fullScreenPlayer').classList.contains('active')) {
                    updateFullScreenPlayerState();
                }
            }, 1000);
        }
    </script>
    
    <!-- 全局音乐管理器 -->
    <script src="../music_manager.js"></script>
</body>
